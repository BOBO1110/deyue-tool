<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>得岳轉檔小工具</title>
<style>
:root{--pink:#E85D8A;--pink-deep:#C93F6E;--pink-soft:#FDE7EF;--ink:#3A2E33;--ink2:#8A7580;--line:#F3DCE5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;
  font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;color:var(--ink)}
.card{width:min(92vw,380px);border:1.5px solid var(--line);border-radius:16px;padding:34px 30px;text-align:center;
  box-shadow:0 6px 30px rgba(200,63,110,.10)}
.logo{width:56px;height:56px;border-radius:16px;background:var(--pink);display:flex;align-items:center;justify-content:center;
  font-size:28px;margin:0 auto 14px;box-shadow:0 3px 10px rgba(200,63,110,.25)}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--ink2);font-size:12.5px;margin:0 0 22px}
input[type=password]{width:100%;font-size:16px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;text-align:center}
input[type=password]:focus{outline:2px solid var(--pink);border-color:var(--pink)}
button{width:100%;margin-top:12px;font-size:15px;font-weight:700;padding:11px;border:none;border-radius:999px;
  background:var(--pink);color:#fff;cursor:pointer}
button:hover{background:var(--pink-deep)}
button:disabled{opacity:.5}
label{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--ink2);margin-top:12px}
.err{color:#D84B4B;font-size:13px;min-height:18px;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">📦</div>
  <h1>得岳轉檔小工具</h1>
  <p class="sub">此頁面已加密，請輸入進站密碼</p>
  <form id="f">
    <input type="password" id="pw" placeholder="進站密碼" autocomplete="current-password" autofocus>
    <button id="go" type="submit">🔓 進入</button>
  </form>
  <label><input type="checkbox" id="rm" checked> 在這台電腦記住密碼</label>
  <div class="err" id="err"></div>
</div>

const b2a=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function tryOpen(pw, silent){
  const btn=document.getElementById('go'); btn.disabled=true; btn.textContent='解鎖中…';
  try{
    const km=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(IV)},key,b2a(CT));
    try{ if(document.getElementById('rm').checked) localStorage.setItem('dygo_gate_pw', pw); }catch(e){}
    document.open(); document.write(new TextDecoder().decode(pt)); document.close();
    return true;
  }catch(e){
    btn.disabled=false; btn.textContent='🔓 進入';
    if(!silent){ document.getElementById('err').textContent='密碼不正確，請再試一次'; }
    try{ localStorage.removeItem('dygo_gate_pw'); }catch(err){}
    return false;
  }
}
document.getElementById('f').addEventListener('submit', e=>{
  e.preventDefault();
  const pw=document.getElementById('pw').value;
  if(pw) tryOpen(pw, false);
});
try{
  const saved=localStorage.getItem('dygo_gate_pw');
  if(saved) tryOpen(saved, true);
}catch(e){}
